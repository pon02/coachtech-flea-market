date.timezone = "Asia/Tokyo"

; Mitigation for CVE-2026-109619 (PHP2Shell) in case of unpatched builds
session.upload_progress.enabled = Off

; Upload limits (must be >= app validation limits to allow FormRequest errors)
; App validation for chat image is 2MB, so keep a small buffer.
upload_max_filesize = 3M
post_max_size = 4M

[mbstring]
mbstring.internal_encoding = "UTF-8"
mbstring.language = "Japanese"